security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # Configuration du provider pour charger les utilisateurs depuis la BDD via l'entité Utilisateur
        app_user_provider:
            entity:
                class: App\Entity\Utilisateur
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # Firewall dédié à la route de connexion
        login:
            pattern: ^/api/login
            stateless: true

        # Firewall principal pour sécuriser toutes les autres routes de l'API
        main:
            lazy: true
            provider: app_user_provider
            stateless: true
            custom_authenticator: App\Security\ApiTokenAuthenticator

    # Contrôle d'accès par rôles (optionnel selon la gestion via API Platform)
    access_control:
        # Permet à tout le monde d'accéder à la route de login
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        # Exemple si vous souhaitez bloquer tout le reste aux utilisateurs non connectés :
        # - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon