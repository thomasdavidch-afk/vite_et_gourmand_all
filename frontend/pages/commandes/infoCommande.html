<section class="container py-5">

    <!-- TITRE -->
    <h2 class="mb-4">Etape 1 : Informations pour la commande</h2>

    <!-- INFOS -->
    <p class="mb-1">
        Merci de remplir les champs suivants
    </p>
    <p class="text-danger small mb-4">
        <strong>Attention :</strong> Si livraison en dehors de Bordeaux, facturation de 5 euros
        (majoré de 59 centimes par km parcouru)
    </p>

    <!-- FORMULAIRE -->
    <form id="formInfoCommande">

        <div class="row g-4">

            <!-- NOM COMPLET -->
            <div class="col-12">
                <label for="nomComplet" class="form-label">Nom Complet *</label>
                <input type="text" class="form-control" id="nomComplet" required>
            </div>

            <!-- TELEPHONE -->
            <div class="col-md-6">
                <label for="telephone" class="form-label">Numéro de téléphone *</label>
                <input type="tel" class="form-control" id="telephone" required>
            </div>

            <!-- EMAIL -->
            <div class="col-md-6">
                <label for="email" class="form-label">Email *</label>
                <input type="email" class="form-control" id="email" required>
            </div>

            <!-- ADRESSE -->
            <div class="col-12">
                <label class="form-label">Adresse de la prestation *</label>
                <div class="row g-2">

                    <!-- ADRESSE POSTALE (N° et Rue) -->
                    <div class="col-12">
                        <input type="text" class="form-control" id="adressePostale" placeholder="N° et nom de la rue (ex: 5 Rue Jean Ligot)" required>
                    </div>

                    <!-- CODE POSTAL -->
                    <div class="col-md-4">
                        <input type="text" class="form-control" id="codePostal" placeholder="Code postal" required>
                    </div>

                    <!-- VILLE -->
                    <div class="col-md-8">
                        <input type="text" class="form-control" id="ville" placeholder="Ville" required>
                    </div>

                </div>
            </div>

            <!-- DATE -->
            <div class="col-md-6">
                <label for="date" class="form-label">Date de la prestation *</label>
                <input type="date" class="form-control" id="date" required>
                <div class="form-text text-muted">Réservation au moins 14 jours à l'avance.</div>
            </div>

            <!-- HEURE -->
            <div class="col-md-6">
                <label for="heure" class="form-label">Heure de la prestation *</label>
                <input type="time" class="form-control" id="heure" required>
            </div>

            <!-- AUTRES INFOS -->
            <div class="col-12">
                <label for="autresInfos" class="form-label">Autres informations ou demandes</label>
                <textarea class="form-control" rows="4" id="autresInfos" placeholder="Allergies particulières, consignes d'accès..."></textarea>
            </div>

        </div>

        <!-- MESSAGE ERREUR GLOBAL -->
        <div id="alertError" class="alert alert-danger mt-4 d-none"></div>

        <!-- BOUTON -->
        <div class="text-center mt-5">
            <button type="submit" class="btn btn-primary px-5 py-3 fw-bold text-white">
                Continuer
            </button>
        </div>

    </form>

</section>
