<section class="container py-5">

    <!-- TITRE -->
    <h2 class="mb-4">Étape 2 : Le choix du Menu</h2>

    <!-- INFOS -->
    <p class="mb-1">Merci de remplir les champs suivants</p>
    <p class="text-danger small mb-4">
        <strong>Attention :</strong> Minimum de personnes par Menu. Si vous êtes plus de 5 personnes 
        au-dessus du minimum requis, vous bénéficiez d'une remise de 10%.
    </p>

    <form id="formChoixMenu" action="/confirmationCommande" method="GET">
        <div class="row g-4">

            <!-- SELECT MENU -->
            <div class="col-12">
                <label class="form-label fw-bold">Choisissez votre Menu</label>
                <select id="selectMenu" class="form-select">
                    <option selected disabled value="">-- Sélectionnez un menu --</option>
                    <!-- Les options sont chargées dynamiquement via le JS -->
                </select>
            </div>

            <!-- SECTION RÉCAPITULATIF ET CALCULS (affichée au choix du menu) -->
            <div id="sectionChoix" class="col-12 d-none">
                <div class="row g-4">

                    <!-- CONTENU DU MENU (Affiche les plats du menu en lecture seule) -->
                    <div class="col-12">
                        <div id="containerContenuMenu" class="p-3 bg-light border rounded">
                            <!-- Rempli dynamiquement par le JS -->
                        </div>
                    </div>

                    <!-- NOMBRE PERSONNES -->
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Nombre de personnes</label>
                        <input type="number" id="nbPersonnes" class="form-control" min="1" placeholder="Entrez un nombre">
                        <div id="erreurPersonnes" class="text-danger small d-none mt-1"></div>
                    </div>

                    <!-- REMISE -->
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Remise appliquée</label>
                        <input type="text" id="remise" class="form-control bg-light" placeholder="Calcul automatique" disabled>
                    </div>

                    <!-- PRIX BASE -->
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Prix de Base</label>
                        <input type="text" id="prixBase" class="form-control bg-light" disabled>
                    </div>

                    <!-- MONTANT REMISE -->
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Montant de la remise</label>
                        <input type="text" id="montantRemise" class="form-control bg-light" disabled>
                    </div>

                    <!-- PRIX TOTAL -->
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Prix Total</label>
                        <input type="text" id="prixTotal" class="form-control bg-light fw-bold text-success fs-5" disabled>
                    </div>

                </div>
            </div>

        </div>

        <!-- MESSAGE INFO PAIEMENT -->
        <div class="alert alert-info mt-4">
            <i class="bi bi-info-circle-fill me-2"></i>
            Suite à votre validation, notre équipe vous contactera pour le paiement de la commande.
        </div>

        <!-- BOUTON DE VALIDATION -->
        <div class="text-center mt-5">
            <button type="submit" class="btn btn-primary px-5 py-3 fw-bold fs-4 rounded">
                Je valide ma commande
            </button>
        </div>

    </form>

</section>
