version: '3.8'

services:
  # 1. Base de données MySQL (Backend principal)
  database:
    image: mysql:8.0
    container_name: vg_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: vite_et_gourmand
      MYSQL_USER: user
      MYSQL_PASSWORD: userpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # 2. Base de données MongoDB (Horaires NoSQL)
  mongodb:
    image: mongo:latest
    container_name: vg_mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # 3. Backend Symfony (PHP-FPM)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vg_backend
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      - database
      - mongodb

  # 4. Serveur Web Nginx pour le Backend (Symfony)
  nginx_backend:
    image: nginx:alpine
    container_name: vg_nginx_backend
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/backend
      - ./backend/docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

  # 5. Frontend (HTML / CSS / JS statique)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vg_frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html

volumes:
  mysql_data:
  mongo_data: